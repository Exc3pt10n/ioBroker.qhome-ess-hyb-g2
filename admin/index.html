<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Q.HOME+ ESS HYB-G2 Konfiguration</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
      }
      table {
        border-spacing: 10px;
      }
      td:first-child {
        font-weight: bold;
        white-space: nowrap;
      }
      input,
      select {
        width: 200px;
      }
    </style>
  </head>
  <body>
    <h2>Adapter-Konfiguration</h2>
    <table>
      <tr>
        <td>ESS Hostname</td>
        <td><input type="text" id="hostname" /></td>
      </tr>
      <tr>
        <td>Batteriekapazität</td>
        <td><input type="number" id="batCapacity" /></td>
      </tr>
      <tr>
        <td>Abfrageintervall</td>
        <td><input type="number" id="uptIntervall" /></td>
      </tr>
      <tr>
        <td>Stromverkaufspreis</td>
        <td><input type="number" id="pSell" /></td>
      </tr>
      <tr>
        <td>Stromeinkaufspreis</td>
        <td><input type="number" id="pBuy" /></td>
      </tr>
      <tr>
        <td>Leasingkosten</td>
        <td><input type="number" id="pLease" /></td>
      </tr>
      <tr>
        <td>Datenbank speichern</td>
        <td><input type="checkbox" id="enableDbStorage" /></td>
      </tr>
      <tr>
        <td>SQL-Instanz</td>
        <td>
          <select id="SqlInstance" class="select-instance" data-type="sql">
            <option value="">Bitte wählen</option>
          </select>
        </td>
      </tr>
      <tr>
        <td>Datenbankname</td>
        <td><input type="text" id="dbName" /></td>
      </tr>
      <tr>
        <td>Datenbanktabelle</td>
        <td><input type="text" id="dbTable" /></td>
      </tr>
      <tr>
        <td>PV-Quelle 1</td>
        <td>
          <select id="pvSource1" class="select-id" data-type="state">
            <option value="">Bitte wählen</option>
          </select>
        </td>
      </tr>
      <tr>
        <td>PV-Quelle 2</td>
        <td>
          <select id="pvSource2" class="select-id" data-type="state">
            <option value="">Bitte wählen</option>
          </select>
        </td>
      </tr>
      <tr>
        <td>PV-Quelle 3</td>
        <td>
          <select id="pvSource3" class="select-id" data-type="state">
            <option value="">Bitte wählen</option>
          </select>
        </td>
      </tr>
    </table>

    <!-- ioBroker Admin Integration -->
    <script src="../../lib/js/jquery.min.js"></script>
    <script src="../../lib/js/translate.js"></script>
    <script src="../../lib/js/admin.js"></script>
  </body>
</html>
