<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Q.HOME+ ESS HYB-G2 Adapter</title>
    <link rel="stylesheet" href="../../admin/css/adapter.css" />
  </head>
  <body>
    <div class="adapter-container">
      <h3>Q.HOME+ ESS HYB-G2 Einstellungen</h3>

      <table>
        <tr>
          <td><label for="hostname">Hostname/IP</label></td>
          <td><input type="text" id="hostname" /></td>
        </tr>
        <tr>
          <td><label for="namespace">Namensraum</label></td>
          <td><input type="text" id="namespace" /></td>
        </tr>
        <tr>
          <td><label for="batCapacity">Speicherkapazität (kWh)</label></td>
          <td><input type="number" id="batCapacity" /></td>
        </tr>
        <tr>
          <td><label for="uptIntervall">Abfrageintervall (Sekunden)</label></td>
          <td><input type="number" id="uptIntervall" /></td>
        </tr>
        <tr>
          <td><label for="pSell">Einspeisevergütung (€/kWh)</label></td>
          <td><input type="number" step="0.0001" id="pSell" /></td>
        </tr>
        <tr>
          <td><label for="pBuy">Bezugspreis (€/kWh)</label></td>
          <td><input type="number" step="0.0001" id="pBuy" /></td>
        </tr>
        <tr>
          <td><label for="pLease">Pachtpreis (€/Monat)</label></td>
          <td><input type="number" step="0.01" id="pLease" /></td>
        </tr>
        <tr>
          <td><label for="dbName">Datenbankname</label></td>
          <td><input type="text" id="dbName" /></td>
        </tr>
        <tr>
          <td><label for="dbTable">Datenbanktabelle</label></td>
          <td><input type="text" id="dbTable" /></td>
        </tr>
      </table>
    </div>
  </body>
</html>
