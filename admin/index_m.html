<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Q.HOME+ ESS HYB-G2 Konfiguration</title>

    <!-- ioBroker Material UI -->
    <link rel="stylesheet" type="text/css" href="../../css/adapter.css" />
    <link
      rel="stylesheet"
      type="text/css"
      href="../../lib/css/materialize.css"
    />
    <script
      type="text/javascript"
      src="../../lib/js/jquery-3.2.1.min.js"
    ></script>
    <script type="text/javascript" src="../../socket.io/socket.io.js"></script>
    <script type="text/javascript" src="../../js/translate.js"></script>
    <script type="text/javascript" src="../../lib/js/materialize.js"></script>
    <script type="text/javascript" src="../../js/adapter-settings.js"></script>

    <!-- Adapter-specific -->
    <link rel="stylesheet" type="text/css" href="style.css" />
    <script type="text/javascript" src="words.js"></script>

    <script type="text/javascript">
      function load(settings, onChange) {
        if (!settings) return;
        $(".value").each(function () {
          const $key = $(this);
          const id = $key.attr("id");
          if ($key.attr("type") === "checkbox") {
            $key.prop("checked", settings[id]).on("change", () => onChange());
          } else {
            $key
              .val(settings[id])
              .on("change", () => onChange())
              .on("keyup", () => onChange());
          }
        });
        onChange(false);
        if (M) M.updateTextFields();
      }

      function save(callback) {
        const obj = {};
        $(".value").each(function () {
          const $this = $(this);
          const id = $this.attr("id");
          if ($this.attr("type") === "checkbox") {
            obj[id] = $this.prop("checked");
          } else {
            obj[id] = $this.val();
          }
        });
        callback(obj);
      }
    </script>
  </head>

  <body>
    <div class="m adapter-container">
      <div class="row">
        <div class="col s12 m4 l2">
          <img src="qhome-ess-hyb-g2.png" class="logo" />
        </div>
      </div>

      <div class="row">
        <div class="col s6 input-field">
          <input type="text" class="value" id="hostname" />
          <label for="hostname" class="translate">ESS Hostname</label>
        </div>

        <div class="col s6 input-field">
          <input type="number" class="value" id="batCapacity" />
          <label for="batCapacity" class="translate"
            >Batteriekapazität (kWh)</label
          >
        </div>

        <div class="col s6 input-field">
          <input type="number" class="value" id="uptIntervall" />
          <label for="uptIntervall" class="translate"
            >Abfrageintervall (Sekunden)</label
          >
        </div>

        <div class="col s6 input-field">
          <input type="number" class="value" id="pSell" step="0.0001" />
          <label for="pSell" class="translate"
            >Stromverkaufspreis (€/kWh)</label
          >
        </div>

        <div class="col s6 input-field">
          <input type="number" class="value" id="pBuy" step="0.0001" />
          <label for="pBuy" class="translate">Stromeinkaufspreis (€/kWh)</label>
        </div>

        <div class="col s6 input-field">
          <input type="number" class="value" id="pLease" step="0.01" />
          <label for="pLease" class="translate">Leasingkosten (€)</label>
        </div>

        <div class="col s6 input-field">
          <input type="checkbox" class="value" id="enableDbStorage" />
          <label for="enableDbStorage" class="translate"
            >Datenbank speichern aktivieren</label
          >
        </div>

        <div class="col s6 input-field">
          <select
            class="value select-instance"
            id="SqlInstance"
            data-type="sql"
          >
            <option value="">Bitte wählen</option>
          </select>
          <label for="SqlInstance" class="translate">SQL-Instanz</label>
        </div>

        <div class="col s6 input-field">
          <input type="text" class="value" id="dbName" />
          <label for="dbName" class="translate">Datenbankname</label>
        </div>

        <div class="col s6 input-field">
          <input type="text" class="value" id="dbTable" />
          <label for="dbTable" class="translate">Datenbanktabelle</label>
        </div>

        <div class="col s6 input-field">
          <select class="value select-id" id="pvSource1" data-type="state">
            <option value="">Bitte wählen</option>
          </select>
          <label for="pvSource1" class="translate">PV-Quelle 1</label>
        </div>

        <div class="col s6 input-field">
          <select class="value select-id" id="pvSource2" data-type="state">
            <option value="">Bitte wählen</option>
          </select>
          <label for="pvSource2" class="translate">PV-Quelle 2</label>
        </div>

        <div class="col s6 input-field">
          <select class="value select-id" id="pvSource3" data-type="state">
            <option value="">Bitte wählen</option>
          </select>
          <label for="pvSource3" class="translate">PV-Quelle 3</label>
        </div>
      </div>
    </div>
  </body>
</html>
